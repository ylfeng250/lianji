name: 功能建议
description: 提出一个功能或交互改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先说明使用场景，再描述方案。练迹不引入账号、联网同步、广告或分析 SDK。

  - type: textarea
    id: problem
    attributes:
      label: 你遇到的使用场景
      placeholder: "在健身房里，我需要……"
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你希望怎么解决
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
    validations:
      required: false

  - type: checkboxes
    id: scope
    attributes:
      label: 范围确认
      options:
        - label: 这个建议不需要联网、账号或分析 SDK
          required: true
        - label: 涉及动作图时会遵守 CC BY-SA 4.0
          required: false
