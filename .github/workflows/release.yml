name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag，例如 v1.2.0'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"

      - name: Resolve version from tag
        run: |
          VERSION="${TAG#v}"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$'; then
            echo "::error title=Tag 格式不正确::tag 需要形如 v1.2.0，收到：$TAG"
            exit 1
          fi
          BASE="${VERSION%%-*}"
          IFS=. read -r MAJOR MINOR PATCH <<< "$BASE"
          VERSION_CODE=$((10#$MAJOR * 10000 + 10#$MINOR * 100 + 10#$PATCH))
          echo "VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "版本：$VERSION（versionCode $VERSION_CODE）"

      - name: Prepare release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "LIANJI_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "SIGNED=1" >> "$GITHUB_ENV"
            echo "已配置发布密钥。"
          else
            echo "SIGNED=0" >> "$GITHUB_ENV"
            echo "::warning title=Release signing::未配置 RELEASE_KEYSTORE_BASE64，本次产物使用 debug 签名，只适合测试。"
          fi

      - name: Build release APK
        env:
          LIANJI_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          LIANJI_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          LIANJI_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew :catalog-tools:test :app:testDebugUnitTest :app:assembleRelease \
            -PappVersionName="$VERSION_NAME" \
            -PappVersionCode="$VERSION_CODE" \
            --stacktrace

      - name: Verify APK
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$BUILD_TOOLS/aapt2" dump badging "$APK" | head -1
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK"
          echo "APK 大小：$(du -h "$APK" | cut -f1)"

      - name: Name assets and checksum
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          if [ "$SIGNED" = "1" ]; then
            ASSET="lianji-${VERSION_NAME}.apk"
          else
            ASSET="lianji-${VERSION_NAME}-debug-signed.apk"
          fi
          cp "$APK" "$ASSET"
          sha256sum "$ASSET" > "$ASSET.sha256"
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"
          cat "$ASSET.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: lianji-${{ env.VERSION_NAME }}
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          name: 练迹 ${{ env.VERSION_NAME }}
          generate_release_notes: true
          prerelease: ${{ contains(env.VERSION_NAME, '-') }}
          fail_on_unmatched_files: true
          files: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256
